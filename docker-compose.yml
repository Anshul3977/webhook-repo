# Local app + MongoDB. Copy .env.example to .env and set WEBHOOK_SECRET first.
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  web:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: ${MONGO_DB:-github_events}
      MONGO_COLLECTION: ${MONGO_COLLECTION:-events}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_TOKEN: ${DEMO_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - mongo
volumes:
  mongo_data:
