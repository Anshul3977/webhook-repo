name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t webhook-monitor:ci .
      - name: Smoke test the health endpoint
        run: |
          docker run -d --name webhook-monitor \
            -e PORT=10000 \
            -e MONGO_URI=mongodb://127.0.0.1:27017/ \
            -e WEBHOOK_SECRET=ci-secret \
            -e DEMO_MODE=false \
            -p 10000:10000 \
            webhook-monitor:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          docker logs webhook-monitor
          exit 1
